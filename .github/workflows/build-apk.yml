name: Build Watch8 Hedge Odds APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Watch8_HedgeOdds_v1_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  watch8-debug-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          test -n "${ANDROID_SDK_ROOT:-}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Watch8 source package
        run: |
          test -f Watch8_HedgeOdds_v1_OneUpload.zip
          mkdir -p android-src
          unzip -q -o Watch8_HedgeOdds_v1_OneUpload.zip -d android-src
          test -f android-src/app/src/main/java/com/hthedge/watch8/HedgeMath.java
          test -f android-src/app/src/main/java/com/hthedge/watch8/MainActivity.java

      - name: Build native Wear OS debug APK
        working-directory: android-src
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-HedgeOdds-v1-APK
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
